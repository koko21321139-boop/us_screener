name: スクリーニング

on:
  schedule:
    # 日本時間 火〜土 7:17（米国の大引け後）。cron は UTC = 日本時間 − 9 時間。GitHubの混雑で遅れることがある
    - cron: '17 22 * * 1-5'
  workflow_dispatch:          # Actions 画面の「Run workflow」で手動実行もできる

permissions:
  contents: write             # 結果を data/ にコミットするため

concurrency: screen

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 株価を取得してスクリーニング
        run: python scripts/screen.py
        env:
          UNIVERSE: ${{ vars.UNIVERSE }}
          MIN_TURNOVER: ${{ vars.MIN_TURNOVER }}
      - name: 変更があればコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "スクリーニング結果（$(TZ=Asia/Tokyo date +%F)）"
          git pull --rebase
          git push
